<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СИТРО — калькулятор 3D-печати</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090909;color:#f5f5f5}header{background:#ff7900;color:#111;padding:28px 5%}header h1{margin:0;font-size:30px}header p{margin:6px 0 0}main{max-width:760px;margin:38px auto;padding:0 20px}.card{background:#151515;border:1px solid #292929;border-radius:22px;padding:28px;box-shadow:0 8px 30px #0008}h2{margin-top:0}label{display:block;font-size:14px;font-weight:650;margin:18px 0 7px}input,select{width:100%;padding:14px;border:1px solid #3a3a3a;background:#0d0d0d;color:#f5f5f5;border-radius:12px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.drop{border:2px dashed #ff7900;border-radius:16px;padding:26px;text-align:center;background:#101010}.muted{color:#aaa;font-size:14px}button{width:100%;padding:16px;border:0;border-radius:13px;background:#ff7900;color:#111;font-size:16px;font-weight:800;margin-top:22px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>СИТРО · Калькулятор 3D-печати</h1><p>Предварительный расчёт стоимости заказа</p></header><main><section class="card"><h2>Рассчитать стоимость</h2><p class="muted">Загрузите модель или вставьте ссылку на MakerWorld.</p><div class="drop"><b>Загрузить STL или 3MF</b><br><span class="muted">или перетащите файл сюда</span><input type="file" accept=".stl,.3mf" style="margin-top:14px"></div><label>Ссылка на MakerWorld</label><input placeholder="https://makerworld.com/..."><div class="grid"><div><label>Материал</label><select><option>PLA</option><option>PETG</option><option>ABS</option><option>PA</option></select></div><div><label>Цвет</label><select><option>Чёрный</option><option>Белый</option><option>Оранжевый</option><option>Другой</option></select></div></div><button>Рассчитать стоимость</button></section></main></body></html>
