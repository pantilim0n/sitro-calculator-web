<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СИТРО — админка портфолио</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f5f5f5}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0 0 8px}.sub{color:#999;margin:0 0 24px}.bar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#ff7900;color:#111}.ghost{background:#1a1a1a;color:#fff;border:1px solid #333}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:16px;margin-bottom:18px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:80px 1.4fr 1.2fr 90px 95px 95px 90px;gap:10px;align-items:center;padding:10px;border:1px solid #292929;border-radius:12px;background:#151515}.row img{width:70px;height:70px;object-fit:cover;border-radius:8px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.status{margin-top:12px;color:#aaa}.status.ok{color:#8bd17c}.status.err{color:#ff8a80}@media(max-width:780px){.row{grid-template-columns:70px 1fr}.row>*{min-width:0}.bar{grid-template-columns:1fr}.row img{grid-row:span 3}}

.cat-wrap{position:relative}.cat-btn{width:100%;text-align:left;background:#111;color:#fff;border:1px solid #333;padding:12px;border-radius:10px;font-weight:600}
.cat-menu{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:#111;border:1px solid #333;border-radius:12px;padding:8px;max-height:240px;overflow:auto;box-shadow:0 12px 30px #0008}
.cat-wrap.open .cat-menu{display:block}.cat-option{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px}.cat-option:hover{background:#1a1a1a}.cat-option input{width:auto}
.cat-summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
</style></head><body><div class="wrap"><h1>Портфолио СИТРО</h1><p class="sub">Добавление работ, категории, названия, порядок и видимость.</p>
<div class="bar"><input id="password" type="password" placeholder="Пароль админки"><button class="primary" id="save">Сохранить изменения</button></div>
<div class="panel"><h2>Категории</h2><div class="bar"><input id="newCategoryName" placeholder="Новая категория"><button class="primary" id="addCategory">Добавить категорию</button></div><div id="categoryManager" class="rows"></div><div class="status" id="catStatus"></div></div><div class="panel"><h2>Добавить работу</h2><div class="bar"><input id="file" type="file" accept="image/*"><input id="title" placeholder="Название работы"></div><div class="bar"><div class="cat-wrap" id="newCatWrap"><button class="cat-btn" type="button"><span class="cat-summary">Выберите категории</span></button><div class="cat-menu"></div></div><button class="primary" id="upload">Загрузить фото</button></div><div class="status" id="uploadStatus"></div></div>
<div class="panel"><div class="rows" id="rows"></div><div class="status" id="status"></div></div></div>
<script>
const rows=document.getElementById('rows'),statusEl=document.getElementById('status'),upStatus=document.getElementById('uploadStatus'),catStatus=document.getElementById('catStatus');let items=[],categoryOptions=[];
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const [r,c]=await Promise.all([fetch('/portfolio.json',{cache:'no-store'}),fetch('/portfolio-categories.json',{cache:'no-store'})]);items=await r.json();categoryOptions=c.ok?await c.json():[];render();renderCategoryManager();}

function catsOf(x){return Array.isArray(x.categories)?x.categories:(x.category?[x.category]:[])}
function catDropdown(selected=[],extraClass=''){
 const all=[...new Set([...(Array.isArray(categoryOptions)?categoryOptions:[]),...selected])];
 const label=selected.length?selected.join(', '):'Выберите категории';
 return '<div class="cat-wrap '+extraClass+'"><button class="cat-btn" type="button"><span class="cat-summary">'+esc(label)+'</span></button><div class="cat-menu">'+all.map(c=>'<label class="cat-option"><input type="checkbox" value="'+esc(c)+'" '+(selected.includes(c)?'checked':'')+'>'+esc(c)+'</label>').join('')+'</div></div>';
}
function renderCategoryManager(){const box=document.getElementById('categoryManager');box.innerHTML=(categoryOptions||[]).map((c,i)=>'<div class="row" style="grid-template-columns:1fr 100px" data-ci="'+i+'"><input class="cat-name" value="'+esc(c)+'"><button class="ghost cat-del">Удалить</button></div>').join('');}
function render(){rows.innerHTML=items.sort((a,b)=>(a.sort??999)-(b.sort??999)).map((x,i)=>'<div class="row" data-i="'+i+'"><img src="/'+esc(x.src)+'"><input class="t" value="'+esc(x.title)+'" placeholder="Название">'+catDropdown(catsOf(x),'row-cats')+'<input class="s" type="number" value="'+(x.sort??i+1)+'" title="Порядок"><label class="check"><input class="f" type="checkbox" '+(x.featured?'checked':'')+'>На главную</label><label class="check"><input class="v" type="checkbox" '+(x.visible!==false?'checked':'')+'>Показывать</label><button class="ghost del">Удалить</button></div>').join('');}
rows.addEventListener('input',e=>{const r=e.target.closest('.row');if(!r)return;const x=items[+r.dataset.i];if(e.target.classList.contains('t'))x.title=e.target.value;if(e.target.closest('.row-cats'))x.categories=[...r.querySelectorAll('.row-cats input:checked')].map(i=>i.value);if(e.target.classList.contains('s'))x.sort=+e.target.value||0;if(e.target.classList.contains('f'))x.featured=e.target.checked;if(e.target.classList.contains('v'))x.visible=e.target.checked;});
rows.addEventListener('click',e=>{if(!e.target.classList.contains('del'))return;const r=e.target.closest('.row');items.splice(+r.dataset.i,1);render();});
async function post(payload){const r=await fetch('/api/admin-portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка');return d;}
document.getElementById('save').onclick=async()=>{statusEl.className='status';catStatus.className='status';statusEl.textContent='Сохраняю работы…';catStatus.textContent='';try{document.querySelectorAll('#rows .row').forEach((r,i)=>{const x=items[+r.dataset.i];x.title=r.querySelector('.t').value;x.categories=[...r.querySelectorAll('.row-cats input:checked')].map(i=>i.value);x.sort=+r.querySelector('.s').value||i+1;x.featured=r.querySelector('.f').checked;x.visible=r.querySelector('.v').checked;});await post({action:'save',items});statusEl.className='status ok';statusEl.textContent='Работы сохранены.';categoryOptions=[...new Set(categoryOptions.map(x=>x.trim()).filter(Boolean))];catStatus.textContent='Сохраняю категории…';await post({action:'saveCategories',categories:categoryOptions});catStatus.className='status ok';catStatus.textContent='Категории сохранены. Vercel обновит сайт после коммитов.';}catch(e){statusEl.className='status err';statusEl.textContent=e.message;catStatus.className='status err';catStatus.textContent='';}};
document.getElementById('addCategory').onclick=()=>{const el=document.getElementById('newCategoryName');const v=el.value.trim();if(!v)return;if(!categoryOptions.includes(v))categoryOptions.push(v);el.value='';renderCategoryManager();render();};
document.getElementById('categoryManager').addEventListener('input',e=>{const r=e.target.closest('[data-ci]');if(!r||!e.target.classList.contains('cat-name'))return;categoryOptions[+r.dataset.ci]=e.target.value;});
document.getElementById('categoryManager').addEventListener('click',e=>{if(!e.target.classList.contains('cat-del'))return;const r=e.target.closest('[data-ci]');categoryOptions.splice(+r.dataset.ci,1);renderCategoryManager();render();});
async function saveCategories(){catStatus.className='status';catStatus.textContent='Сохраняю категории…';try{categoryOptions=[...new Set(categoryOptions.map(x=>x.trim()).filter(Boolean))];await post({action:'saveCategories',categories:categoryOptions});catStatus.className='status ok';catStatus.textContent='Категории сохранены.';}catch(e){catStatus.className='status err';catStatus.textContent=e.message;}}

document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){upStatus.textContent='Выберите фото';return;}upStatus.className='status';upStatus.textContent='Загружаю…';const b64=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=fail;r.readAsDataURL(f);});try{await post({action:'upload',filename:f.name,dataBase64:b64,title:document.getElementById('title').value,categories:[...document.querySelectorAll('#newCatWrap input:checked')].map(i=>i.value)});upStatus.className='status ok';upStatus.textContent='Фото добавлено. Обновляю список…';await load();}catch(e){upStatus.className='status err';upStatus.textContent=e.message;}};
document.getElementById('newCatWrap').outerHTML=catDropdown([],'new-cats').replace('class="cat-wrap new-cats"','class="cat-wrap new-cats" id="newCatWrap"');
document.addEventListener('click',e=>{
 const btn=e.target.closest('.cat-btn');
 if(btn){const w=btn.closest('.cat-wrap');document.querySelectorAll('.cat-wrap.open').forEach(x=>{if(x!==w)x.classList.remove('open')});w.classList.toggle('open');return;}
 if(!e.target.closest('.cat-wrap'))document.querySelectorAll('.cat-wrap.open').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('change',e=>{
 const w=e.target.closest('.cat-wrap');if(!w||e.target.type!=='checkbox')return;
 const vals=[...w.querySelectorAll('input:checked')].map(i=>i.value);
 w.querySelector('.cat-summary').textContent=vals.length?vals.join(', '):'Выберите категории';
 const r=w.closest('.row');if(r){const x=items[+r.dataset.i];x.categories=vals;}
});
load().catch(e=>{statusEl.className='status err';statusEl.textContent='Не удалось загрузить portfolio.json';});
</script></body></html>
