<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СИТРО — админка портфолио</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f5f5f5}.wrap{max-width:1180px;margin:auto;padding:28px 18px}h1{margin:0 0 8px}.sub{color:#999;margin:0 0 24px}.bar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}button{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}button:disabled{cursor:wait;opacity:.58}.primary{background:#ff7900;color:#111}.ghost{background:#1a1a1a;color:#fff;border:1px solid #333}.panel{background:#111;border:1px solid #292929;border-radius:8px;padding:16px;margin-bottom:18px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:28px 34px 80px minmax(170px,1.4fr) minmax(150px,1.2fr) 74px 96px 96px 82px;gap:10px;align-items:center;padding:10px;border:1px solid #292929;border-radius:8px;background:#151515}.row img{width:70px;height:70px;object-fit:cover;border-radius:8px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.status{margin-top:12px;color:#aaa}.status.ok{color:#8bd17c}.status.err{color:#ff8a80}

.cat-wrap{position:relative}.cat-btn{width:100%;text-align:left;background:#111;color:#fff;border:1px solid #333;padding:12px;border-radius:10px;font-weight:600}
.cat-menu{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:#111;border:1px solid #333;border-radius:8px;padding:8px;max-height:240px;overflow:auto;box-shadow:0 12px 30px #0008}
.cat-wrap.open .cat-menu{display:block}.cat-option{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px}.cat-option:hover{background:#1a1a1a}.cat-option input{width:auto}
.cat-summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.drag-handle{cursor:grab;user-select:none;-webkit-user-select:none;color:#777;font-size:22px;text-align:center;line-height:1;padding:12px 6px;touch-action:none}
.drag-handle:active{cursor:grabbing}.row.dragging{opacity:.45;border-color:#ff7900}.row.drag-over{border-color:#ff7900;box-shadow:0 0 0 1px #ff790066}

.upload-preview{display:none;margin-top:12px;border:1px solid #2b2b2b;border-radius:14px;padding:12px;background:#0d0d0d;align-items:center;gap:14px}
.upload-preview.show{display:flex}.upload-preview img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #333}.upload-preview-meta{color:#aaa;font-size:14px;line-height:1.45}

.categories-spoiler{border:1px solid #292929;border-radius:8px;background:#111;margin-bottom:18px;overflow:hidden}
.categories-spoiler summary{list-style:none;cursor:pointer;padding:16px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.categories-spoiler summary::-webkit-details-marker{display:none}
.categories-spoiler summary::after{content:"▾";color:#ff7900;transition:transform .2s ease}
.categories-spoiler[open] summary::after{transform:rotate(180deg)}
.categories-spoiler-body{padding:0 16px 16px}

.admin-tools{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;margin:0 0 14px}
.admin-tools .check{justify-content:center;background:#111;border:1px solid #333;border-radius:10px;padding:0 12px}
@media(max-width:780px){.admin-tools{grid-template-columns:1fr}}

.thumb-cell{display:grid;gap:6px;justify-items:center}.thumb-cell img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.replace-photo{font-size:11px;padding:6px 8px!important;border-radius:8px!important;white-space:nowrap}.replace-input{display:none}

.sticky-save{position:sticky;top:10px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:10px 12px;border:1px solid #333;border-radius:8px;background:#0d0d0dee;backdrop-filter:blur(10px)}
.unsaved{font-size:13px;color:#8e8e8e}.unsaved.dirty{color:#ff9a3d}
.sticky-save .primary{white-space:nowrap}

.login-gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login-card{width:min(420px,100%);background:#111;border:1px solid #2c2c2c;border-radius:8px;padding:24px}
.login-card h1{margin:0 0 8px}.login-card p{color:#999;margin:0 0 18px}.login-card input{margin-bottom:10px}
.admin-app{display:none}.admin-app.show{display:block}.login-error{color:#ff8a80;font-size:14px;margin-top:10px}
.logout{background:#1a1a1a;color:#fff;border:1px solid #333}

.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}
.admin-stat{background:#111;border:1px solid #292929;border-radius:8px;padding:14px}
.admin-stat span{display:block;color:#888;font-size:12px}.admin-stat b{display:block;font-size:24px;margin-top:3px}
@media(max-width:780px){.admin-stats{grid-template-columns:repeat(2,1fr)}}

.bulk-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:10px;border:1px solid #2b2b2b;border-radius:12px;background:#0d0d0d}
.bulk-bar .count{color:#aaa;font-size:13px;margin-right:auto}.bulk-bar button{padding:8px 10px;font-size:13px}
.row-select{width:auto!important}

.bulk-categories{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;margin-top:4px}
.bulk-categories select{width:auto;min-width:190px;padding:8px 10px}

.work-text{display:grid;gap:6px}.work-text input{width:100%}.work-description{font-size:13px}

.backup-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.backup-tools input[type=file]{display:none}

.work-description-row{display:grid;grid-template-columns:1fr auto;gap:6px}
.gen-description{padding:8px 10px!important;font-size:12px!important;white-space:nowrap}

.work-description-wrap{display:grid;gap:5px}
.work-description-label{font-size:12px;color:#8f8f8f}
.work-description-row{display:grid;grid-template-columns:1fr;gap:6px;align-items:center}
.gen-description{display:block!important;width:100%!important;padding:10px 12px!important;font-size:13px!important;font-weight:700!important;white-space:normal!important;background:#ff7a00!important;color:#111!important;border-color:#ff7a00!important}
@media(max-width:980px){.row{grid-template-columns:34px minmax(0,1fr)}.row>*{min-width:0}.row-select{grid-column:1;grid-row:1}.drag-handle{grid-column:1;grid-row:2}.thumb-cell,.work-text,.row-cats,.row>.s,.row>.check,.row>.del{grid-column:2}.thumb-cell{justify-items:start;grid-template-columns:80px auto;align-items:center}.bar{grid-template-columns:1fr}.sticky-save{position:static;align-items:stretch;flex-direction:column}.sticky-save>div{width:100%}.sticky-save button,.sticky-save a{flex:1;justify-content:center}.bulk-bar{align-items:stretch}.bulk-bar .count{width:100%;margin:0}.bulk-categories{align-items:stretch}.bulk-categories select{width:100%}}
</style></head><body><div class="wrap">
<div class="login-gate" id="loginGate"><div class="login-card"><h1>Админка СИТРО</h1><p>Введите пароль для управления портфолио.</p><input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password"><button class="primary" id="loginBtn">Войти</button><div class="login-error" id="loginError" role="alert" aria-live="polite"></div></div></div>
<div class="admin-app" id="adminApp"><h1>Портфолио СИТРО</h1><p class="sub">Добавление работ, категории, названия, порядок и видимость.</p>
<div class="sticky-save"><span id="unsavedState" class="unsaved">Изменений нет</span><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="logout" href="/#portfolio" target="_blank" style="display:inline-flex;align-items:center;text-decoration:none;padding:12px 16px;border-radius:10px">Открыть сайт</a><button class="logout" id="resetChanges" type="button">Отменить изменения</button><button class="logout" id="logoutBtn" type="button">Выйти</button><button class="primary" id="save">Сохранить изменения</button></div></div>
<div class="admin-stats"><div class="admin-stat"><span>Всего работ</span><b id="statTotal">0</b></div><div class="admin-stat"><span>Показываются</span><b id="statVisible">0</b></div><div class="admin-stat"><span>На главной</span><b id="statFeatured">0</b></div><div class="admin-stat"><span>Категорий</span><b id="statCategories">0</b></div></div>
<div class="backup-tools"><button class="ghost" id="downloadBackup" type="button">Скачать резервную копию</button><button class="ghost" id="restoreBackupBtn" type="button">Восстановить из копии</button><input id="restoreBackupFile" type="file" accept=".json,application/json"></div>
<details class="categories-spoiler"><summary>Категории</summary><div class="categories-spoiler-body"><div class="bar"><input id="newCategoryName" placeholder="Новая категория"><button class="primary" id="addCategory">Добавить категорию</button></div><div id="categoryManager" class="rows"></div><div class="status" id="catStatus" role="status" aria-live="polite"></div></div></details><div class="panel"><h2>Добавить работу</h2><div class="bar"><input id="file" type="file" accept="image/*"><input id="title" placeholder="Название работы"></div><div class="bar"><input id="description" placeholder="Короткое описание работы (необязательно)"></div><div class="bar"><div class="cat-wrap" id="newCatWrap"><button class="cat-btn" type="button"><span class="cat-summary">Выберите категории</span></button><div class="cat-menu"></div></div><button class="primary" id="upload">Загрузить фото</button></div><div class="upload-preview" id="uploadPreview"><img id="uploadPreviewImg" alt="Предпросмотр"><div class="upload-preview-meta" id="uploadPreviewMeta"></div></div><div class="status" id="uploadStatus" role="status" aria-live="polite"></div></div>
<div class="panel"><div class="admin-tools"><input id="workSearch" placeholder="Поиск по названию, описанию или категории"><select id="workCategoryFilter"><option value="">Все категории</option></select><select id="workVisibilityFilter"><option value="">Все работы</option><option value="visible">Только показываемые</option><option value="hidden">Только скрытые</option></select><label class="check"><input id="featuredOnly" type="checkbox">Только на главной</label></div><div class="bulk-bar"><label class="check"><input id="selectAllWorks" type="checkbox">Выбрать все</label><span class="count" id="bulkCount">Выбрано: 0</span><button class="ghost" type="button" data-bulk="feature">На главную</button><button class="ghost" type="button" data-bulk="unfeature">Убрать с главной</button><button class="ghost" type="button" data-bulk="show">Показывать</button><button class="ghost" type="button" data-bulk="hide">Скрыть</button><button class="ghost" type="button" data-bulk="delete">Удалить выбранные</button><button class="primary" type="button" id="bulkGenerateDescriptions">Сгенерировать описание выбранным</button><div class="bulk-categories"><select id="bulkCategory"><option value="">Выберите категорию</option></select><button class="ghost" type="button" data-bulk-category="add">Добавить категорию</button><button class="ghost" type="button" data-bulk-category="remove">Убрать категорию</button></div></div><div class="rows" id="rows"></div><div class="status" id="status" role="status" aria-live="polite"></div></div></div></div>
<script type="module">
import {categoriesOf as catsOf, filterPortfolioItems, generateDescription, normalizeCategoryList, removeCategoryFromItems, renameCategoryInItems, setItemCategories} from './admin-core.js';
const rows=document.getElementById('rows'),statusEl=document.getElementById('status'),upStatus=document.getElementById('uploadStatus'),catStatus=document.getElementById('catStatus'),unsavedState=document.getElementById('unsavedState');let items=[],categoryOptions=[],dirty=false;
const loginGate=document.getElementById('loginGate'),adminApp=document.getElementById('adminApp'),loginPassword=document.getElementById('loginPassword'),loginError=document.getElementById('loginError');
async function loginWith(password){loginError.textContent='';if(!password)throw new Error('Введите пароль');const r=await fetch('/api/admin-portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'auth',password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка входа');await load();sessionStorage.setItem('sitroAdminPassword',password);loginGate.style.display='none';adminApp.classList.add('show');}
document.getElementById('loginBtn').onclick=async e=>{const button=e.currentTarget;button.disabled=true;button.textContent='Вхожу…';try{await loginWith(loginPassword.value);}catch(error){loginError.textContent=error.message;}finally{button.disabled=false;button.textContent='Войти';}};
loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();});
document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('sitroAdminPassword');location.reload();};
document.getElementById('resetChanges').onclick=async()=>{if(dirty&&!confirm('Отменить все несохранённые изменения?'))return;statusEl.className='status';statusEl.textContent='Обновляю данные…';try{await load();setDirty(false);statusEl.className='status ok';statusEl.textContent='Несохранённые изменения отменены.';}catch(e){statusEl.className='status err';statusEl.textContent='Не удалось обновить данные.';}};
document.getElementById('downloadBackup').onclick=()=>{const payload={version:1,createdAt:new Date().toISOString(),items,categoryOptions};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='sitro-portfolio-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);};
document.getElementById('restoreBackupBtn').onclick=()=>document.getElementById('restoreBackupFile').click();
document.getElementById('restoreBackupFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.items)||!Array.isArray(data.categoryOptions))throw new Error('Файл не похож на резервную копию СИТРО');if(!confirm('Загрузить данные из резервной копии? Текущие несохранённые изменения будут заменены.'))return;items=data.items;categoryOptions=normalizeCategoryList(data.categoryOptions);renderCategoryManager();render();renderNewUploadCategories();setDirty();statusEl.className='status ok';statusEl.textContent='Резервная копия загружена. Нажмите «Сохранить изменения».';}catch(err){statusEl.className='status err';statusEl.textContent=err.message||'Не удалось прочитать резервную копию';}finally{e.target.value='';}});

function setDirty(v=true){dirty=v;unsavedState.textContent=v?'Есть несохранённые изменения':'Изменений нет';unsavedState.classList.toggle('dirty',v);}
function updateStats(){document.getElementById('statTotal').textContent=items.length;document.getElementById('statVisible').textContent=items.filter(x=>x.visible!==false).length;document.getElementById('statFeatured').textContent=items.filter(x=>x.featured).length;document.getElementById('statCategories').textContent=(categoryOptions||[]).length;}
window.addEventListener('beforeunload',e=>{if(!dirty)return;e.preventDefault();e.returnValue='';});
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderNewUploadCategories(){const host=document.getElementById('newCatWrap');if(!host)return;const selected=[...host.querySelectorAll('input:checked')].map(input=>input.value).filter(value=>categoryOptions.includes(value));host.outerHTML=catDropdown(selected,'new-cats').replace('class="cat-wrap new-cats"','class="cat-wrap new-cats" id="newCatWrap"');}
async function load(){const stamp='?admin='+Date.now();const [portfolioResponse,categoriesResponse]=await Promise.all([fetch('/portfolio.json'+stamp,{cache:'no-store'}),fetch('/portfolio-categories.json'+stamp,{cache:'no-store'})]);if(!portfolioResponse.ok)throw new Error('Не удалось загрузить портфолио: HTTP '+portfolioResponse.status);if(!categoriesResponse.ok)throw new Error('Не удалось загрузить категории: HTTP '+categoriesResponse.status);const nextItems=await portfolioResponse.json();const nextCategories=await categoriesResponse.json();if(!Array.isArray(nextItems)||!Array.isArray(nextCategories))throw new Error('Сервер вернул некорректные данные портфолио');items=nextItems;categoryOptions=normalizeCategoryList(nextCategories);renderCategoryManager();renderNewUploadCategories();render();}

function catDropdown(selected=[],extraClass=''){
 const all=[...new Set([...(Array.isArray(categoryOptions)?categoryOptions:[]),...selected])];
 const label=selected.length?selected.join(', '):'Выберите категории';
 return '<div class="cat-wrap '+extraClass+'"><button class="cat-btn" type="button"><span class="cat-summary">'+esc(label)+'</span></button><div class="cat-menu">'+all.map(c=>'<label class="cat-option"><input type="checkbox" value="'+esc(c)+'" '+(selected.includes(c)?'checked':'')+'>'+esc(c)+'</label>').join('')+'</div></div>';
}
function renderCategoryManager(){updateStats();const box=document.getElementById('categoryManager');box.innerHTML=(categoryOptions||[]).map((c,i)=>'<div class="row" style="grid-template-columns:1fr 100px" data-ci="'+i+'" data-original="'+esc(c)+'"><input class="cat-name" value="'+esc(c)+'"><button class="ghost cat-del" type="button">Удалить</button></div>').join('');const f=document.getElementById('workCategoryFilter');if(f){const cur=f.value;f.innerHTML='<option value="">Все категории</option>'+(categoryOptions||[]).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');f.value=categoryOptions.includes(cur)?cur:'';}const bf=document.getElementById('bulkCategory');if(bf){const cur=bf.value;bf.innerHTML='<option value="">Выберите категорию</option>'+(categoryOptions||[]).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');bf.value=categoryOptions.includes(cur)?cur:'';}}
function normalizeOrder(){items.forEach((x,i)=>x.sort=i+1)}
function render(){
 updateStats();
 items.sort((a,b)=>(a.sort??999)-(b.sort??999));
 const q=(document.getElementById('workSearch')?.value||'').trim().toLowerCase();
 const cf=document.getElementById('workCategoryFilter')?.value||'';
 const vf=document.getElementById('workVisibilityFilter')?.value||'';
 const onlyFeatured=!!document.getElementById('featuredOnly')?.checked;
 const visibleItems=filterPortfolioItems(items,{query:q,category:cf,visibility:vf,featuredOnly:onlyFeatured});
 rows.innerHTML=visibleItems.map((x,i)=>'<div class="row" data-id="'+esc(x.id)+'"><input class="row-select" type="checkbox" title="Выбрать"><div class="drag-handle" draggable="true" title="Перетащить">⋮⋮</div><div class="thumb-cell"><img src="/'+esc(x.src)+'" alt="'+esc(x.title||'Работа СИТРО')+'"><button type="button" class="ghost replace-photo">Заменить</button><input class="replace-input" type="file" accept="image/*"></div><div class="work-text"><input class="t" value="'+esc(x.title)+'" placeholder="Название"><div class="work-description-wrap"><div class="work-description-label">Описание работы</div><div class="work-description-row"><input class="d work-description" value="'+esc(x.description||'')+'" placeholder="Здесь появится описание"><button type="button" class="gen-description">Сгенерировать описание</button></div></div></div>'+catDropdown(catsOf(x),'row-cats')+'<input class="s" type="number" value="'+(x.sort??i+1)+'" title="Порядок"><label class="check"><input class="f" type="checkbox" '+(x.featured?'checked':'')+'>На главную</label><label class="check"><input class="v" type="checkbox" '+(x.visible!==false?'checked':'')+'>Показывать</label><button class="ghost del">Удалить</button></div>').join('');
 document.getElementById('selectAllWorks').checked=false;
 updateBulkCount();
}
rows.addEventListener('click',e=>{const b=e.target.closest('.gen-description');if(!b)return;const r=b.closest('.row');const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;const title=r.querySelector('.t').value;const cats=[...r.querySelectorAll('.row-cats input:checked')].map(i=>i.value);const d=r.querySelector('.d');d.value=generateDescription(title,cats);x.description=d.value;setDirty();});
rows.addEventListener('input',e=>{const r=e.target.closest('.row');if(!r)return;const editsData=e.target.classList.contains('t')||e.target.classList.contains('d')||e.target.classList.contains('s')||e.target.classList.contains('f')||e.target.classList.contains('v')||e.target.closest('.row-cats');if(!editsData)return;const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;setDirty();if(e.target.classList.contains('t'))x.title=e.target.value;if(e.target.classList.contains('d'))x.description=e.target.value;if(e.target.closest('.row-cats'))setItemCategories(items,r.dataset.id,[...r.querySelectorAll('.row-cats input:checked')].map(i=>i.value));if(e.target.classList.contains('s'))x.sort=+e.target.value||0;if(e.target.classList.contains('f'))x.featured=e.target.checked;if(e.target.classList.contains('v'))x.visible=e.target.checked;updateStats();});
rows.addEventListener('click',e=>{if(!e.target.classList.contains('del'))return;const r=e.target.closest('.row');const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;if(!confirm('Удалить работу «'+(x.title||'без названия')+'» из портфолио?'))return;items=items.filter(v=>String(v.id)!==r.dataset.id);normalizeOrder();setDirty();render();});
let draggedId=null;
rows.addEventListener('dragstart',e=>{const handle=e.target.closest('.drag-handle');if(!handle)return;const r=handle.closest('.row');if(!r)return;draggedId=r.dataset.id;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedId);});
rows.addEventListener('dragend',e=>{const r=e.target.closest('.row');if(r)r.classList.remove('dragging');rows.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));draggedId=null;});
rows.addEventListener('dragover',e=>{const r=e.target.closest('.row');if(!r||!draggedId||r.dataset.id===draggedId)return;e.preventDefault();rows.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));r.classList.add('drag-over');e.dataTransfer.dropEffect='move';});
rows.addEventListener('drop',e=>{const target=e.target.closest('.row');if(!target||!draggedId||target.dataset.id===draggedId)return;e.preventDefault();const from=items.findIndex(x=>String(x.id)===draggedId),to=items.findIndex(x=>String(x.id)===target.dataset.id);if(from<0||to<0)return;const [moved]=items.splice(from,1);items.splice(to,0,moved);normalizeOrder();setDirty();render();});
rows.addEventListener('click',e=>{if(!e.target.classList.contains('replace-photo'))return;const r=e.target.closest('.row');r.querySelector('.replace-input').click();});
rows.addEventListener('change',async e=>{if(!e.target.classList.contains('replace-input'))return;const input=e.target,file=input.files[0],row=input.closest('.row');if(!file||!row)return;const item=items.find(value=>String(value.id)===row.dataset.id);if(!item)return;statusEl.className='status';statusEl.textContent='Подготавливаю новое фото…';try{const prepared=await prepareImage(file);statusEl.textContent='Загружаю новое фото…';const data=await post({action:'uploadOnly',...prepared});item.src=data.src;const previewUrl=URL.createObjectURL(file);const image=row.querySelector('img');image.src=previewUrl;image.onload=()=>URL.revokeObjectURL(previewUrl);setDirty();statusEl.className='status ok';statusEl.textContent='Фото заменено. Нажмите «Сохранить изменения».';}catch(error){statusEl.className='status err';statusEl.textContent=error.message;}finally{input.value='';}});
function selectedIds(){return [...rows.querySelectorAll('.row-select:checked')].map(c=>c.closest('.row').dataset.id)}
function updateBulkCount(){document.getElementById('bulkCount').textContent='Выбрано: '+selectedIds().length;}
rows.addEventListener('change',e=>{if(e.target.classList.contains('row-select'))updateBulkCount();});
document.getElementById('selectAllWorks').addEventListener('change',e=>{rows.querySelectorAll('.row-select').forEach(c=>c.checked=e.target.checked);updateBulkCount();});
document.getElementById('bulkGenerateDescriptions').addEventListener('click',()=>{
 const ids=selectedIds();
 if(!ids.length){statusEl.className='status err';statusEl.textContent='Сначала отметьте одну или несколько работ галочками слева.';return;}
 let changed=0;
 items.forEach(x=>{if(!ids.includes(String(x.id)))return;x.description=generateDescription(x.title,catsOf(x));changed++;});
 setDirty();render();document.getElementById('selectAllWorks').checked=false;updateBulkCount();
 statusEl.className='status ok';statusEl.textContent='Описание сгенерировано для работ: '+changed+'. Нажмите «Сохранить изменения».';
});
document.querySelector('.bulk-bar').addEventListener('click',e=>{
 const actionBtn=e.target.closest('[data-bulk]');
 const categoryBtn=e.target.closest('[data-bulk-category]');
 if(!actionBtn&&!categoryBtn)return;
 const ids=selectedIds();
 if(!ids.length){statusEl.className='status err';statusEl.textContent='Сначала выберите хотя бы одну работу.';return;}
 if(categoryBtn){
   const cat=document.getElementById('bulkCategory').value;
   if(!cat){statusEl.className='status err';statusEl.textContent='Сначала выберите категорию.';return;}
   const mode=categoryBtn.dataset.bulkCategory;
   let changed=0;
   items.forEach(x=>{
     if(!ids.includes(String(x.id)))return;
     const cats=catsOf(x);
     if(mode==='add'&&!cats.includes(cat)){x.categories=[...cats,cat];changed++;}
     if(mode==='remove'&&cats.includes(cat)){x.categories=cats.filter(c=>c!==cat);changed++;}
   });
   setDirty();
   statusEl.className='status ok';
   statusEl.textContent=(mode==='add'?'Категория добавлена: ':'Категория убрана: ')+cat+' · работ: '+changed+'. Нажмите «Сохранить изменения».';
 }else{
   const action=actionBtn.dataset.bulk;
   if(action==='delete'){
     if(!confirm('Удалить выбранные работы из портфолио?'))return;
     items=items.filter(x=>!ids.includes(String(x.id)));
     normalizeOrder();
     statusEl.className='status ok';
     statusEl.textContent='Выбранные работы удалены из списка. Нажмите «Сохранить изменения».';
   }else{
     items.forEach(x=>{if(!ids.includes(String(x.id)))return;if(action==='feature')x.featured=true;if(action==='unfeature')x.featured=false;if(action==='show')x.visible=true;if(action==='hide')x.visible=false;});
     statusEl.className='status ok';
     statusEl.textContent='Массовое действие применено. Нажмите «Сохранить изменения».';
   }
   setDirty();
 }
 render();
 document.getElementById('selectAllWorks').checked=false;
 updateBulkCount();
});
async function post(payload){let response;try{response=await fetch('/api/admin-portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,password:sessionStorage.getItem('sitroAdminPassword')||''})});}catch{throw new Error('Нет связи с сервером. Проверьте интернет и повторите попытку.');}const data=await response.json().catch(()=>({}));if(!response.ok){if(response.status===401)throw new Error('Сессия завершена. Выйдите и войдите снова.');throw new Error(data.error||('Ошибка сервера: HTTP '+response.status));}return data;}
document.getElementById('save').onclick=async e=>{const button=e.currentTarget;statusEl.className='status';catStatus.className='status';statusEl.textContent='Сохраняю изменения…';catStatus.textContent='';button.disabled=true;button.textContent='Сохраняю…';try{categoryOptions=normalizeCategoryList(categoryOptions);await post({action:'saveAll',items,categories:categoryOptions});statusEl.className='status ok';statusEl.textContent='Работы и категории сохранены.';catStatus.className='status ok';catStatus.textContent='Изменения отправлены. Vercel обновит сайт после коммита.';setDirty(false);renderCategoryManager();renderNewUploadCategories();render();}catch(error){statusEl.className='status err';statusEl.textContent=error.message;catStatus.className='status err';catStatus.textContent='Изменения не сохранены.';}finally{button.disabled=false;button.textContent='Сохранить изменения';}};
document.getElementById('addCategory').onclick=()=>{const el=document.getElementById('newCategoryName');const value=el.value.trim();catStatus.className='status';if(!value){catStatus.className='status err';catStatus.textContent='Введите название категории.';return;}if(categoryOptions.includes(value)){catStatus.className='status err';catStatus.textContent='Такая категория уже есть.';return;}categoryOptions.push(value);el.value='';catStatus.className='status ok';catStatus.textContent='Категория добавлена. Сохраните изменения.';setDirty();renderCategoryManager();renderNewUploadCategories();render();};
document.getElementById('categoryManager').addEventListener('input',e=>{const row=e.target.closest('[data-ci]');if(!row||!e.target.classList.contains('cat-name'))return;categoryOptions[+row.dataset.ci]=e.target.value;setDirty();});
document.getElementById('categoryManager').addEventListener('change',e=>{const row=e.target.closest('[data-ci]');if(!row||!e.target.classList.contains('cat-name'))return;const previous=row.dataset.original;const next=e.target.value.trim();if(!next){categoryOptions[+row.dataset.ci]=previous;catStatus.className='status err';catStatus.textContent='Название категории не может быть пустым.';renderCategoryManager();return;}renameCategoryInItems(items,previous,next);categoryOptions=normalizeCategoryList(categoryOptions);catStatus.className='status ok';catStatus.textContent='Категория переименована во всех связанных работах. Сохраните изменения.';renderCategoryManager();renderNewUploadCategories();render();});
document.getElementById('categoryManager').addEventListener('click',e=>{if(!e.target.classList.contains('cat-del'))return;const row=e.target.closest('[data-ci]');const index=+row.dataset.ci;const category=categoryOptions[index];const usedBy=items.filter(item=>catsOf(item).includes(category)).length;if(!confirm('Удалить категорию «'+category+'»? Она будет убрана из работ: '+usedBy+'.'))return;categoryOptions.splice(index,1);removeCategoryFromItems(items,category);catStatus.className='status ok';catStatus.textContent='Категория удалена из списка и связанных работ. Сохраните изменения.';setDirty();renderCategoryManager();renderNewUploadCategories();render();});

const fileInput=document.getElementById('file'),preview=document.getElementById('uploadPreview'),previewImg=document.getElementById('uploadPreviewImg'),previewMeta=document.getElementById('uploadPreviewMeta');
function blobToBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('Не удалось прочитать изображение.'));reader.readAsDataURL(blob);});}
async function prepareImage(file){if(!file.type.startsWith('image/'))throw new Error('Выберите файл изображения.');let image;try{image=await createImageBitmap(file);}catch{throw new Error('Браузер не смог прочитать это изображение. Используйте JPG, PNG или WebP.');}const maxSide=1800;const scale=Math.min(1,maxSide/Math.max(image.width,image.height));const width=Math.max(1,Math.round(image.width*scale));const height=Math.max(1,Math.round(image.height*scale));const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const context=canvas.getContext('2d');context.drawImage(image,0,0,width,height);image.close?.();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.86));if(!blob)throw new Error('Не удалось подготовить изображение.');const base=(file.name.replace(/\.[^.]+$/,'')||'portfolio').replace(/[^a-zA-Z0-9._-]/g,'-');return{filename:base+'.webp',dataBase64:await blobToBase64(blob)};}
fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(!f){preview.classList.remove('show');previewImg.removeAttribute('src');previewMeta.textContent='';return;}const url=URL.createObjectURL(f);previewImg.src=url;preview.classList.add('show');previewMeta.textContent=f.name+' · '+Math.max(1,Math.round(f.size/1024))+' КБ';previewImg.onload=()=>URL.revokeObjectURL(url);});
document.getElementById('upload').onclick=async e=>{const button=e.currentTarget;const file=fileInput.files[0];if(!file){upStatus.className='status err';upStatus.textContent='Выберите фото.';return;}button.disabled=true;button.textContent='Загружаю…';upStatus.className='status';upStatus.textContent='Подготавливаю изображение…';try{const prepared=await prepareImage(file);upStatus.textContent='Загружаю изображение…';const data=await post({action:'upload',...prepared,title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),categories:[...document.querySelectorAll('#newCatWrap input:checked')].map(input=>input.value)});if(data.item)items.push(data.item);document.getElementById('title').value='';document.getElementById('description').value='';fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewMeta.textContent='';renderNewUploadCategories();render();setDirty(false);upStatus.className='status ok';upStatus.textContent='Фото и работа добавлены. Публикация обновится после деплоя.';}catch(error){upStatus.className='status err';upStatus.textContent=error.message;}finally{button.disabled=false;button.textContent='Загрузить фото';}};
document.addEventListener('click',e=>{
 const btn=e.target.closest('.cat-btn');
 if(btn){const w=btn.closest('.cat-wrap');document.querySelectorAll('.cat-wrap.open').forEach(x=>{if(x!==w)x.classList.remove('open')});w.classList.toggle('open');return;}
 if(!e.target.closest('.cat-wrap'))document.querySelectorAll('.cat-wrap.open').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('change',e=>{
 const w=e.target.closest('.cat-wrap');if(!w||e.target.type!=='checkbox')return;
 const vals=[...w.querySelectorAll('input:checked')].map(i=>i.value);
 w.querySelector('.cat-summary').textContent=vals.length?vals.join(', '):'Выберите категории';
 const r=w.closest('.row');if(r)setItemCategories(items,r.dataset.id,vals);
});
document.getElementById('workSearch').addEventListener('input',render);
document.getElementById('workCategoryFilter').addEventListener('change',render);
document.getElementById('workVisibilityFilter').addEventListener('change',render);
document.getElementById('featuredOnly').addEventListener('change',render);
const savedPass=sessionStorage.getItem('sitroAdminPassword');if(savedPass){loginWith(savedPass).catch(()=>{sessionStorage.removeItem('sitroAdminPassword');loginGate.style.display='flex';adminApp.classList.remove('show');});}
