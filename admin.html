<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СИТРО — админка портфолио</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f5f5f5}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0 0 8px}.sub{color:#999;margin:0 0 24px}.bar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#ff7900;color:#111}.ghost{background:#1a1a1a;color:#fff;border:1px solid #333}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:16px;margin-bottom:18px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:28px 34px 80px 1.4fr 1.2fr 90px 95px 95px 90px;gap:10px;align-items:center;padding:10px;border:1px solid #292929;border-radius:12px;background:#151515}.row img{width:70px;height:70px;object-fit:cover;border-radius:8px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.status{margin-top:12px;color:#aaa}.status.ok{color:#8bd17c}.status.err{color:#ff8a80}@media(max-width:780px){.row{grid-template-columns:70px 1fr}.row>*{min-width:0}.bar{grid-template-columns:1fr}.row img{grid-row:span 3}}

.cat-wrap{position:relative}.cat-btn{width:100%;text-align:left;background:#111;color:#fff;border:1px solid #333;padding:12px;border-radius:10px;font-weight:600}
.cat-menu{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:#111;border:1px solid #333;border-radius:12px;padding:8px;max-height:240px;overflow:auto;box-shadow:0 12px 30px #0008}
.cat-wrap.open .cat-menu{display:block}.cat-option{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px}.cat-option:hover{background:#1a1a1a}.cat-option input{width:auto}
.cat-summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.drag-handle{cursor:grab;user-select:none;-webkit-user-select:none;color:#777;font-size:22px;text-align:center;line-height:1;padding:12px 6px;touch-action:none}
.drag-handle:active{cursor:grabbing}.row.dragging{opacity:.45;border-color:#ff7900}.row.drag-over{border-color:#ff7900;box-shadow:0 0 0 1px #ff790066}

.upload-preview{display:none;margin-top:12px;border:1px solid #2b2b2b;border-radius:14px;padding:12px;background:#0d0d0d;align-items:center;gap:14px}
.upload-preview.show{display:flex}.upload-preview img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #333}.upload-preview-meta{color:#aaa;font-size:14px;line-height:1.45}

.categories-spoiler{border:1px solid #292929;border-radius:16px;background:#111;margin-bottom:18px;overflow:hidden}
.categories-spoiler summary{list-style:none;cursor:pointer;padding:16px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.categories-spoiler summary::-webkit-details-marker{display:none}
.categories-spoiler summary::after{content:"▾";color:#ff7900;transition:transform .2s ease}
.categories-spoiler[open] summary::after{transform:rotate(180deg)}
.categories-spoiler-body{padding:0 16px 16px}

.admin-tools{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;margin:0 0 14px}
.admin-tools .check{justify-content:center;background:#111;border:1px solid #333;border-radius:10px;padding:0 12px}
@media(max-width:780px){.admin-tools{grid-template-columns:1fr}}

.thumb-cell{display:grid;gap:6px;justify-items:center}.thumb-cell img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.replace-photo{font-size:11px;padding:6px 8px!important;border-radius:8px!important;white-space:nowrap}.replace-input{display:none}

.sticky-save{position:sticky;top:10px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:10px 12px;border:1px solid #333;border-radius:14px;background:#0d0d0dee;backdrop-filter:blur(10px)}
.unsaved{font-size:13px;color:#8e8e8e}.unsaved.dirty{color:#ff9a3d}
.sticky-save .primary{white-space:nowrap}

.login-gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login-card{width:min(420px,100%);background:#111;border:1px solid #2c2c2c;border-radius:18px;padding:24px}
.login-card h1{margin:0 0 8px}.login-card p{color:#999;margin:0 0 18px}.login-card input{margin-bottom:10px}
.admin-app{display:none}.admin-app.show{display:block}.login-error{color:#ff8a80;font-size:14px;margin-top:10px}
.logout{background:#1a1a1a;color:#fff;border:1px solid #333}

.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}
.admin-stat{background:#111;border:1px solid #292929;border-radius:14px;padding:14px}
.admin-stat span{display:block;color:#888;font-size:12px}.admin-stat b{display:block;font-size:24px;margin-top:3px}
@media(max-width:780px){.admin-stats{grid-template-columns:repeat(2,1fr)}}

.bulk-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:10px;border:1px solid #2b2b2b;border-radius:12px;background:#0d0d0d}
.bulk-bar .count{color:#aaa;font-size:13px;margin-right:auto}.bulk-bar button{padding:8px 10px;font-size:13px}
.row-select{width:auto!important}

.bulk-categories{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;margin-top:4px}
.bulk-categories select{width:auto;min-width:190px;padding:8px 10px}
</style></head><body><div class="wrap">
<div class="login-gate" id="loginGate"><div class="login-card"><h1>Админка СИТРО</h1><p>Введите пароль для управления портфолио.</p><input id="loginPassword" type="password" placeholder="Пароль"><button class="primary" id="loginBtn">Войти</button><div class="login-error" id="loginError"></div></div></div>
<div class="admin-app" id="adminApp"><h1>Портфолио СИТРО</h1><p class="sub">Добавление работ, категории, названия, порядок и видимость.</p>
<div class="sticky-save"><span id="unsavedState" class="unsaved">Изменений нет</span><div style="display:flex;gap:8px"><a class="logout" href="/#portfolio" target="_blank" style="display:inline-flex;align-items:center;text-decoration:none;padding:12px 16px;border-radius:10px">Открыть сайт</a><button class="logout" id="logoutBtn" type="button">Выйти</button><button class="primary" id="save">Сохранить изменения</button></div></div>
<div class="admin-stats"><div class="admin-stat"><span>Всего работ</span><b id="statTotal">0</b></div><div class="admin-stat"><span>Показываются</span><b id="statVisible">0</b></div><div class="admin-stat"><span>На главной</span><b id="statFeatured">0</b></div><div class="admin-stat"><span>Категорий</span><b id="statCategories">0</b></div></div>
<details class="categories-spoiler"><summary>Категории</summary><div class="categories-spoiler-body"><div class="bar"><input id="newCategoryName" placeholder="Новая категория"><button class="primary" id="addCategory">Добавить категорию</button></div><div id="categoryManager" class="rows"></div><div class="status" id="catStatus"></div></div></details><div class="panel"><h2>Добавить работу</h2><div class="bar"><input id="file" type="file" accept="image/*"><input id="title" placeholder="Название работы"></div><div class="bar"><div class="cat-wrap" id="newCatWrap"><button class="cat-btn" type="button"><span class="cat-summary">Выберите категории</span></button><div class="cat-menu"></div></div><button class="primary" id="upload">Загрузить фото</button></div><div class="upload-preview" id="uploadPreview"><img id="uploadPreviewImg" alt="Предпросмотр"><div class="upload-preview-meta" id="uploadPreviewMeta"></div></div><div class="status" id="uploadStatus"></div></div>
<div class="panel"><div class="admin-tools"><input id="workSearch" placeholder="Поиск по названию"><select id="workCategoryFilter"><option value="">Все категории</option></select><select id="workVisibilityFilter"><option value="">Все работы</option><option value="visible">Только показываемые</option><option value="hidden">Только скрытые</option></select><label class="check"><input id="featuredOnly" type="checkbox">Только на главной</label></div><div class="bulk-bar"><label class="check"><input id="selectAllWorks" type="checkbox">Выбрать все</label><span class="count" id="bulkCount">Выбрано: 0</span><button class="ghost" type="button" data-bulk="feature">На главную</button><button class="ghost" type="button" data-bulk="unfeature">Убрать с главной</button><button class="ghost" type="button" data-bulk="show">Показывать</button><button class="ghost" type="button" data-bulk="hide">Скрыть</button><div class="bulk-categories"><select id="bulkCategory"><option value="">Выберите категорию</option></select><button class="ghost" type="button" id="bulkAddCategory">Добавить категорию</button><button class="ghost" type="button" id="bulkRemoveCategory">Убрать категорию</button></div></div><div class="rows" id="rows"></div><div class="status" id="status"></div></div></div></div>
<script>
const rows=document.getElementById('rows'),statusEl=document.getElementById('status'),upStatus=document.getElementById('uploadStatus'),catStatus=document.getElementById('catStatus'),unsavedState=document.getElementById('unsavedState');let items=[],categoryOptions=[],dirty=false;
const loginGate=document.getElementById('loginGate'),adminApp=document.getElementById('adminApp'),loginPassword=document.getElementById('loginPassword'),loginError=document.getElementById('loginError');
async function loginWith(password){loginError.textContent='';const r=await fetch('/api/admin-portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'auth',password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка входа');sessionStorage.setItem('sitroAdminPassword',password);loginGate.style.display='none';adminApp.classList.add('show');await load();}
document.getElementById('loginBtn').onclick=async()=>{try{await loginWith(loginPassword.value);}catch(e){loginError.textContent=e.message;}};
loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();});
document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('sitroAdminPassword');location.reload();};

function setDirty(v=true){dirty=v;unsavedState.textContent=v?'Есть несохранённые изменения':'Изменений нет';unsavedState.classList.toggle('dirty',v);}
function updateStats(){document.getElementById('statTotal').textContent=items.length;document.getElementById('statVisible').textContent=items.filter(x=>x.visible!==false).length;document.getElementById('statFeatured').textContent=items.filter(x=>x.featured).length;document.getElementById('statCategories').textContent=(categoryOptions||[]).length;}
window.addEventListener('beforeunload',e=>{if(!dirty)return;e.preventDefault();e.returnValue='';});
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const [r,c]=await Promise.all([fetch('/portfolio.json',{cache:'no-store'}),fetch('/portfolio-categories.json',{cache:'no-store'})]);items=await r.json();categoryOptions=c.ok?await c.json():[];render();renderCategoryManager();}

function catsOf(x){return Array.isArray(x.categories)?x.categories:(x.category?[x.category]:[])}
function catDropdown(selected=[],extraClass=''){
 const all=[...new Set([...(Array.isArray(categoryOptions)?categoryOptions:[]),...selected])];
 const label=selected.length?selected.join(', '):'Выберите категории';
 return '<div class="cat-wrap '+extraClass+'"><button class="cat-btn" type="button"><span class="cat-summary">'+esc(label)+'</span></button><div class="cat-menu">'+all.map(c=>'<label class="cat-option"><input type="checkbox" value="'+esc(c)+'" '+(selected.includes(c)?'checked':'')+'>'+esc(c)+'</label>').join('')+'</div></div>';
}
function renderCategoryManager(){updateStats();const box=document.getElementById('categoryManager');box.innerHTML=(categoryOptions||[]).map((c,i)=>'<div class="row" style="grid-template-columns:1fr 100px" data-ci="'+i+'"><input class="cat-name" value="'+esc(c)+'"><button class="ghost cat-del">Удалить</button></div>').join('');const f=document.getElementById('workCategoryFilter');if(f){const cur=f.value;f.innerHTML='<option value="">Все категории</option>'+(categoryOptions||[]).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');f.value=categoryOptions.includes(cur)?cur:'';}const bf=document.getElementById('bulkCategory');if(bf){const cur=bf.value;bf.innerHTML='<option value="">Выберите категорию</option>'+(categoryOptions||[]).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');bf.value=categoryOptions.includes(cur)?cur:'';}}
function normalizeOrder(){items.forEach((x,i)=>x.sort=i+1)}
function render(){
 updateStats();
 items.sort((a,b)=>(a.sort??999)-(b.sort??999));
 const q=(document.getElementById('workSearch')?.value||'').trim().toLowerCase();
 const cf=document.getElementById('workCategoryFilter')?.value||'';
 const vf=document.getElementById('workVisibilityFilter')?.value||'';
 const onlyFeatured=!!document.getElementById('featuredOnly')?.checked;
 const visibleItems=items.filter(x=>{
   const title=(x.title||'').toLowerCase();
   const cats=catsOf(x);
   const visibilityOk=!vf||(vf==='visible'?x.visible!==false:x.visible===false);
   return (!q||title.includes(q)||cats.some(c=>c.toLowerCase().includes(q)))&&(!cf||cats.includes(cf))&&visibilityOk&&(!onlyFeatured||x.featured);
 });
 rows.innerHTML=visibleItems.map((x,i)=>'<div class="row" data-id="'+esc(x.id)+'" data-i="'+i+'"><input class="row-select" type="checkbox" title="Выбрать"><div class="drag-handle" draggable="true" title="Перетащить">⋮⋮</div><div class="thumb-cell"><img src="/'+esc(x.src)+'"><button type="button" class="ghost replace-photo">Заменить</button><input class="replace-input" type="file" accept="image/*"></div><input class="t" value="'+esc(x.title)+'" placeholder="Название">'+catDropdown(catsOf(x),'row-cats')+'<input class="s" type="number" value="'+(x.sort??i+1)+'" title="Порядок"><label class="check"><input class="f" type="checkbox" '+(x.featured?'checked':'')+'>На главную</label><label class="check"><input class="v" type="checkbox" '+(x.visible!==false?'checked':'')+'>Показывать</label><button class="ghost del">Удалить</button></div>').join('');
}
rows.addEventListener('input',e=>{setDirty();const r=e.target.closest('.row');if(!r)return;const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;if(e.target.classList.contains('t'))x.title=e.target.value;if(e.target.closest('.row-cats'))x.categories=[...r.querySelectorAll('.row-cats input:checked')].map(i=>i.value);if(e.target.classList.contains('s'))x.sort=+e.target.value||0;if(e.target.classList.contains('f'))x.featured=e.target.checked;if(e.target.classList.contains('v'))x.visible=e.target.checked;updateStats();});
rows.addEventListener('click',e=>{if(!e.target.classList.contains('del'))return;const r=e.target.closest('.row');const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;if(!confirm('Удалить работу «'+(x.title||'без названия')+'» из портфолио?'))return;items=items.filter(v=>String(v.id)!==r.dataset.id);normalizeOrder();setDirty();render();});
let draggedId=null;
rows.addEventListener('dragstart',e=>{const handle=e.target.closest('.drag-handle');if(!handle)return;const r=handle.closest('.row');if(!r)return;draggedId=r.dataset.id;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedId);});
rows.addEventListener('dragend',e=>{const r=e.target.closest('.row');if(r)r.classList.remove('dragging');rows.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));draggedId=null;});
rows.addEventListener('dragover',e=>{const r=e.target.closest('.row');if(!r||!draggedId||r.dataset.id===draggedId)return;e.preventDefault();rows.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));r.classList.add('drag-over');e.dataTransfer.dropEffect='move';});
rows.addEventListener('drop',e=>{const target=e.target.closest('.row');if(!target||!draggedId||target.dataset.id===draggedId)return;e.preventDefault();const from=items.findIndex(x=>String(x.id)===draggedId),to=items.findIndex(x=>String(x.id)===target.dataset.id);if(from<0||to<0)return;const [moved]=items.splice(from,1);items.splice(to,0,moved);normalizeOrder();setDirty();render();});
rows.addEventListener('click',e=>{if(!e.target.classList.contains('replace-photo'))return;const r=e.target.closest('.row');r.querySelector('.replace-input').click();});
rows.addEventListener('change',async e=>{if(!e.target.classList.contains('replace-input'))return;const input=e.target,f=input.files[0],r=input.closest('.row');if(!f||!r)return;const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;statusEl.className='status';statusEl.textContent='Загружаю новое фото…';try{const b64=await new Promise((ok,fail)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(',')[1]);fr.onerror=fail;fr.readAsDataURL(f);});const d=await post({action:'uploadOnly',filename:f.name,dataBase64:b64});x.src=d.src;setDirty();statusEl.className='status ok';statusEl.textContent='Фото заменено. Нажмите «Сохранить изменения».';render();}catch(err){statusEl.className='status err';statusEl.textContent=err.message;}});
function selectedIds(){return [...rows.querySelectorAll('.row-select:checked')].map(c=>c.closest('.row').dataset.id)}
function updateBulkCount(){document.getElementById('bulkCount').textContent='Выбрано: '+selectedIds().length;}
rows.addEventListener('change',e=>{if(e.target.classList.contains('row-select'))updateBulkCount();});
document.getElementById('selectAllWorks').addEventListener('change',e=>{rows.querySelectorAll('.row-select').forEach(c=>c.checked=e.target.checked);updateBulkCount();});
document.querySelector('.bulk-bar').addEventListener('click',e=>{const b=e.target.closest('[data-bulk]');if(!b)return;const ids=selectedIds();if(!ids.length)return;const action=b.dataset.bulk;items.forEach(x=>{if(!ids.includes(String(x.id)))return;if(action==='feature')x.featured=true;if(action==='unfeature')x.featured=false;if(action==='show')x.visible=true;if(action==='hide')x.visible=false;});setDirty();render();document.getElementById('selectAllWorks').checked=false;updateBulkCount();});
document.getElementById('bulkAddCategory').addEventListener('click',()=>{const cat=document.getElementById('bulkCategory').value,ids=selectedIds();if(!cat||!ids.length)return;items.forEach(x=>{if(!ids.includes(String(x.id)))return;const cats=catsOf(x);if(!cats.includes(cat))x.categories=[...cats,cat];});setDirty();render();document.getElementById('selectAllWorks').checked=false;updateBulkCount();});
document.getElementById('bulkRemoveCategory').addEventListener('click',()=>{const cat=document.getElementById('bulkCategory').value,ids=selectedIds();if(!cat||!ids.length)return;items.forEach(x=>{if(!ids.includes(String(x.id)))return;x.categories=catsOf(x).filter(c=>c!==cat);});setDirty();render();document.getElementById('selectAllWorks').checked=false;updateBulkCount();});
async function post(payload){const r=await fetch('/api/admin-portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,password:sessionStorage.getItem('sitroAdminPassword')||''})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка');return d;}
document.getElementById('save').onclick=async()=>{statusEl.className='status';catStatus.className='status';statusEl.textContent='Сохраняю работы…';catStatus.textContent='';try{document.querySelectorAll('#rows .row').forEach((r,i)=>{const x=items.find(v=>String(v.id)===r.dataset.id);if(!x)return;x.title=r.querySelector('.t').value;x.categories=[...r.querySelectorAll('.row-cats input:checked')].map(i=>i.value);x.sort=+r.querySelector('.s').value||i+1;x.featured=r.querySelector('.f').checked;x.visible=r.querySelector('.v').checked;});await post({action:'save',items});statusEl.className='status ok';statusEl.textContent='Работы сохранены.';categoryOptions=[...new Set(categoryOptions.map(x=>x.trim()).filter(Boolean))];catStatus.textContent='Сохраняю категории…';await post({action:'saveCategories',categories:categoryOptions});catStatus.className='status ok';catStatus.textContent='Категории сохранены. Vercel обновит сайт после коммитов.';setDirty(false);}catch(e){statusEl.className='status err';statusEl.textContent=e.message;catStatus.className='status err';catStatus.textContent='';}};
document.getElementById('addCategory').onclick=()=>{const el=document.getElementById('newCategoryName');const v=el.value.trim();if(!v)return;if(!categoryOptions.includes(v))categoryOptions.push(v);el.value='';setDirty();renderCategoryManager();render();};
document.getElementById('categoryManager').addEventListener('input',e=>{const r=e.target.closest('[data-ci]');if(!r||!e.target.classList.contains('cat-name'))return;categoryOptions[+r.dataset.ci]=e.target.value;setDirty();});
document.getElementById('categoryManager').addEventListener('click',e=>{if(!e.target.classList.contains('cat-del'))return;const r=e.target.closest('[data-ci]');categoryOptions.splice(+r.dataset.ci,1);setDirty();renderCategoryManager();render();});
async function saveCategories(){catStatus.className='status';catStatus.textContent='Сохраняю категории…';try{categoryOptions=[...new Set(categoryOptions.map(x=>x.trim()).filter(Boolean))];await post({action:'saveCategories',categories:categoryOptions});catStatus.className='status ok';catStatus.textContent='Категории сохранены.';}catch(e){catStatus.className='status err';catStatus.textContent=e.message;}}

const fileInput=document.getElementById('file'),preview=document.getElementById('uploadPreview'),previewImg=document.getElementById('uploadPreviewImg'),previewMeta=document.getElementById('uploadPreviewMeta');
fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(!f){preview.classList.remove('show');previewImg.removeAttribute('src');previewMeta.textContent='';return;}const url=URL.createObjectURL(f);previewImg.src=url;preview.classList.add('show');previewMeta.textContent=f.name+' · '+Math.max(1,Math.round(f.size/1024))+' КБ';previewImg.onload=()=>URL.revokeObjectURL(url);});
document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){upStatus.textContent='Выберите фото';return;}upStatus.className='status';upStatus.textContent='Загружаю…';const b64=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=fail;r.readAsDataURL(f);});try{await post({action:'upload',filename:f.name,dataBase64:b64,title:document.getElementById('title').value,categories:[...document.querySelectorAll('#newCatWrap input:checked')].map(i=>i.value)});upStatus.className='status ok';upStatus.textContent='Фото добавлено. Обновляю список…';document.getElementById('title').value='';fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewMeta.textContent='';await load();setDirty(false);}catch(e){upStatus.className='status err';upStatus.textContent=e.message;}};
document.getElementById('newCatWrap').outerHTML=catDropdown([],'new-cats').replace('class="cat-wrap new-cats"','class="cat-wrap new-cats" id="newCatWrap"');
document.addEventListener('click',e=>{
 const btn=e.target.closest('.cat-btn');
 if(btn){const w=btn.closest('.cat-wrap');document.querySelectorAll('.cat-wrap.open').forEach(x=>{if(x!==w)x.classList.remove('open')});w.classList.toggle('open');return;}

document.addEventListener('change',e=>{
 const w=e.target.closest('.cat-wrap');if(!w||e.target.type!=='checkbox')return;
 const vals=[...w.querySelectorAll('input:checked')].map(i=>i.value);
 w.querySelector('.cat-summary').textContent=vals.length?vals.join(', '):'Выберите категории';
 const r=w.closest('.row');if(r){const x=items[+r.dataset.i];x.categories=vals;}
});
