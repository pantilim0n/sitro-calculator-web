<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СИТРО — админка портфолио</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#f5f5f5}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0 0 8px}.sub{color:#999;margin:0 0 24px}.bar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#ff7900;color:#111}.ghost{background:#1a1a1a;color:#fff;border:1px solid #333}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:16px;margin-bottom:18px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:80px 1.4fr 1fr 90px 80px 90px;gap:10px;align-items:center;padding:10px;border:1px solid #292929;border-radius:12px;background:#151515}.row img{width:70px;height:70px;object-fit:cover;border-radius:8px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.status{margin-top:12px;color:#aaa}.status.ok{color:#8bd17c}.status.err{color:#ff8a80}@media(max-width:780px){.row{grid-template-columns:70px 1fr}.row>*{min-width:0}.bar{grid-template-columns:1fr}.row img{grid-row:span 3}}
</style></head><body><div class="wrap"><h1>Портфолио СИТРО</h1><p class="sub">Добавление работ, категории, названия, порядок и видимость.</p>
<div class="bar"><input id="password" type="password" placeholder="Пароль админки"><button class="primary" id="save">Сохранить изменения</button></div>
<div class="panel"><h2>Добавить работу</h2><div class="bar"><input id="file" type="file" accept="image/*"><input id="title" placeholder="Название работы"></div><div class="bar"><input id="category" placeholder="Категория, например: Фигурки"><button class="primary" id="upload">Загрузить фото</button></div><div class="status" id="uploadStatus"></div></div>
<div class="panel"><div class="rows" id="rows"></div><div class="status" id="status"></div></div></div>
<script>
const rows=document.getElementById('rows'),statusEl=document.getElementById('status'),upStatus=document.getElementById('uploadStatus');let items=[];
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const r=await fetch('/portfolio.json',{cache:'no-store'});items=await r.json();render();}
function render(){rows.innerHTML=items.sort((a,b)=>(a.sort??999)-(b.sort??999)).map((x,i)=>`<div class="row" data-i="${i}"><img src="/${esc(x.src)}"><input class="t" value="${esc(x.title)}" placeholder="Название"><input class="c" value="${esc(x.category)}" placeholder="Категория"><input class="s" type="number" value="${x.sort??i+1}" title="Порядок"><label class="check"><input class="v" type="checkbox" ${x.visible!==false?'checked':''}>Показывать</label><button class="ghost del">Удалить</button></div>`).join('');}
rows.addEventListener('input',e=>{const r=e.target.closest('.row');if(!r)return;const x=items[+r.dataset.i];if(e.target.classList.contains('t'))x.title=e.target.value;if(e.target.classList.contains('c'))x.category=e.target.value;if(e.target.classList.contains('s'))x.sort=+e.target.value||0;if(e.target.classList.contains('v'))x.visible=e.target.checked;});
rows.addEventListener('click',e=>{if(!e.target.classList.contains('del'))return;const r=e.target.closest('.row');items.splice(+r.dataset.i,1);render();});
async function post(payload){const r=await fetch('/api/admin-portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка');return d;}
document.getElementById('save').onclick=async()=>{statusEl.className='status';statusEl.textContent='Сохраняю…';try{document.querySelectorAll('.row').forEach((r,i)=>{const x=items[+r.dataset.i];x.title=r.querySelector('.t').value;x.category=r.querySelector('.c').value;x.sort=+r.querySelector('.s').value||i+1;x.visible=r.querySelector('.v').checked;});await post({action:'save',items});statusEl.className='status ok';statusEl.textContent='Сохранено. Vercel обновит сайт после коммита.';}catch(e){statusEl.className='status err';statusEl.textContent=e.message;}};
document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){upStatus.textContent='Выберите фото';return;}upStatus.className='status';upStatus.textContent='Загружаю…';const b64=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=fail;r.readAsDataURL(f);});try{await post({action:'upload',filename:f.name,dataBase64:b64,title:document.getElementById('title').value,category:document.getElementById('category').value});upStatus.className='status ok';upStatus.textContent='Фото добавлено. Обновляю список…';await load();}catch(e){upStatus.className='status err';upStatus.textContent=e.message;}};
load().catch(e=>{statusEl.className='status err';statusEl.textContent='Не удалось загрузить portfolio.json';});
</script></body></html>
