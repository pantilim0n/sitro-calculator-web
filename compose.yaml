services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.server
    networks:
      - sitro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sitro

networks:
  sitro:

volumes:
  caddy_data:
  caddy_config:
